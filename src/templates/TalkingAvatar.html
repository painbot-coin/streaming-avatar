<script>
	$(document).ready(function () {
		var currenturl = window.location.href,
			url_array = currenturl.split('/'),
			url = url_array[0] + '//' + url_array[2];

		var videoPlayer, waitPlayer,
			videoSources = [];
		var currentVideoIndex = 0, video_num, flag = true;
		videoPlayer = $('div#video').children('video');
		waitPlayer = $('div#wait').children('video');
		var flag = true;

		$('textarea#answer1').on('keydown', function (event) {
			if (event.which === 13) { // Check if the key code is 13 (Enter key)
				event.preventDefault(); // Prevent the default behavior of Enter key (e.g., newline in a textarea)
				console.log('enter=================')
				ask_f(); // Call your function when Enter key is pressed
			}
		});

		$("button#ask").click(function () {
			ask_f();
		});

		function ask_f() {
			var prompt = $('textarea#answer1').val();
			var audio = document.getElementById('speech');
			$('#view1').val(prompt);
			$('textarea#answer1').val('');
			console.log(prompt + '-------');

			$.getJSON('findanswer', {
				val: prompt
			}, function (data) {
				console.log(data.audio_path);
				setTimeout(function () {
					audio.src = data.audio_path;
					audio.load();
					// Set other attributes
					audio.controls = true; // Add controls so the user can play, pause, etc.
					audio.autoplay = false; // Set to true to automatically start playing
					audio.loop = false; // Set to true to loop the playback  https://avatar.facefile.co/ 
				}, 1200);


				var img = document.getElementById('vframe');
				// Set the source of the image
				//url_for function is for streaming data
				img.src = "{{ url_for('videostream') }}";  // Replace with your image path
				img.addEventListener('load', function() {
					console.log('Ready');
					document.getElementById("wait").style.display = "none";
					img.style.display = 'block';
					var audio1 = document.getElementById('speech');
					audio1.play();
					
				});

			});
			return false;
		}
	});
</script>
<script>
	document.getElementById('start').addEventListener('ended', myHandler, false);
	function myHandler(e) {
		// alert("Video Finished");
		document.getElementById("start").style.display = "none";
		document.getElementById("wait").style.display = "block";
	}
	videoPlayer = $('div#start').children('video');
	videoPlayer.on('loadeddata', function () {
		var viewtext = $('textarea#view1').val();
		// $('#view1').val(viewtext+"\n\n"+data+".");
		var additionalText = "Hi. My name is Genelia. I am a video bot powered by Gen AI Technology. To assist you better, may I know your name?";
		renderAdditionalTextWordByWord("view1", additionalText);
	});
	function show_bot() {
		var video_bot = document.getElementById("videobot");
		var bot_btn = document.getElementById("botbtn");
		if (video_bot.style.display === "none") {
			video_bot.style.display = "block";
			bot_btn.style.display = "none";
		} else {
			video_bot.style.display = "none";
			bot_btn.style.display = "block";
		}
		document.getElementById('start').play();
	}
</script>

</html>
